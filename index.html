<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FDF9F2">
  <meta name="description" content="张圣艳的个人作品集。视觉设计、产品建模与交互设计。">
  <title>张圣艳</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="customize.css">
</head>
<body data-page-family="marketing">
  <a class="skip" href="#work" id="skip-link">跳到作品</a>
  <header class="site-header">
    <a class="wordmark" href="#home" id="header-name">张圣艳</a>
    <div class="header-tools">
      <button class="icon-button language-switch" id="language-switch" type="button" aria-label="Switch to English">EN</button>
      <button class="icon-button" id="theme-switch" type="button" aria-label="切换深浅主题"></button>
      <a class="header-contact" href="#contact" id="header-contact">联系</a>
    </div>
  </header>
  <main class="marketing-main page-content" id="page-content" tabindex="-1">
    <p class="startup-status" id="load-status" role="status">正在载入示例内容…</p>
  </main>
  <footer class="site-footer"><a href="#home" id="footer-name">张圣艳</a><span id="demo-note"></span><span id="year"></span></footer>
  <nav class="island" aria-label="页面导航">
    <button class="island-cue" id="island-cue" type="button" aria-label="向下查看作品"></button>
    <div class="island-navigation">
      <button class="island-home" id="back-top" type="button" aria-label="回到当前页顶部"></button>
      <div class="island-tabs" id="island-tabs"><span class="island-active" aria-hidden="true"></span></div>
    </div>
  </nav>
  <dialog id="project-dialog" aria-labelledby="preview-title">
    <div class="preview-card">
      <button class="close-preview" id="preview-close" type="button" aria-label="关闭作品详情"></button>
      <div class="preview-body"><div class="preview-media" tabindex="0" aria-label="作品媒体"></div><aside class="preview-info" tabindex="0" aria-label="作品介绍"></aside></div>
    </div>
  </dialog>
  <script type="module" src="main.js"></script>
</body>
</html>
