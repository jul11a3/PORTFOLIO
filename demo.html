<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slow Notes — Local demo</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#e3eadc;color:#27342c;font-family:system-ui,sans-serif;transition:background-color .2s}main{width:min(480px,90%);padding:32px}small{font-size:11px;letter-spacing:.1em;color:#637368}h1{font-size:clamp(28px,8vw,48px);line-height:1.1;letter-spacing:-.05em;margin:20px 0}p{line-height:1.8;color:#637368;font-size:14px}textarea{display:block;width:100%;min-height:160px;border:0;border-bottom:1px solid #798e7c55;border-radius:0;background:transparent;resize:vertical;font:18px/1.8 Georgia,serif;color:#27342c;padding:14px 0;outline-offset:4px}nav{display:flex;gap:12px;margin-top:26px}button{width:36px;height:36px;border:1px solid #27342c30;border-radius:50%;cursor:pointer}button[aria-pressed=true]{outline:2px solid #637368;outline-offset:3px}.a{background:#e3eadc}.b{background:#e3e6ed}.c{background:#f1e0d4}@media(prefers-reduced-motion:reduce){body{transition:none}}</style></head><body><main><small>INTERACTIVE DEMO</small><h1>Slow Notes.</h1><p>把一个念头放在这里。<br>Leave a little thought here.</p><textarea aria-label="示例笔记 / Demo note" placeholder="今天留意到了什么？ / What did you notice?"></textarea><nav aria-label="背景颜色 / Background color"><button class="a" aria-label="绿色 / Green" aria-pressed="true" data-color="#e3eadc"></button><button class="b" aria-label="蓝色 / Blue" aria-pressed="false" data-color="#e3e6ed"></button><button class="c" aria-label="杏色 / Apricot" aria-pressed="false" data-color="#f1e0d4"></button></nav></main><script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{document.body.style.backgroundColor=button.dataset.color;document.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));</script></body></html>
